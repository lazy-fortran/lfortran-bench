id: lf-5987-implicit-dealloc-exit
title: "lfortran: fix implicit deallocation after early loop exit"
repo_url: https://github.com/lfortran/lfortran.git
issue_url: https://github.com/lfortran/lfortran/pull/5987
base_commit: 0cb53f030931ed70c05295ed41263886277ae982
fixed_commit: bfdf0ed5573f7731c408caa27bc9fac0d06f280b
setup_commands:
  - "conda run -n lf-llvm11 bash -c 'cd {workspace} && bash build0.sh && cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DWITH_LLVM=yes -DCMAKE_BUILD_TYPE=Debug -DWITH_ZSTD=no -DWITH_ZLIB=no -DWITH_RUNTIME_STACKTRACE=yes && ninja -C build'"
acceptance_commands:
  - "python3 {task_dir}/validate.py {workspace}"
issue_body: |
  An allocatable array is incorrectly deallocated after an early exit
  from a do loop. The implicit deallocation pass inserts a deallocation
  at the loop exit point, corrupting the array contents for subsequent
  use.
acceptance_hint: |
  The validator compiles and runs integration_tests/do_loop_06.f90
  using the built lfortran binary. The test allocates an array, exits
  a loop early, and verifies the array contents are preserved.
