id: lf-7039-extended-type-assign
title: "lfortran: fix extended derived types assignment"
repo_url: https://github.com/lfortran/lfortran.git
issue_url: https://github.com/lfortran/lfortran/pull/7039
base_commit: 112a47ecbb8039d47d27978f6d7bed58bfc4f0c9
fixed_commit: 23424c9e53ea6e4be0a525c6806d3ec63f9dc14f
setup_commands:
  - "conda run -n lf-llvm11 bash -c 'cd {workspace} && bash build0.sh && cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DWITH_LLVM=yes -DCMAKE_BUILD_TYPE=Debug -DWITH_ZSTD=no -DWITH_ZLIB=no -DWITH_RUNTIME_STACKTRACE=yes && ninja -C build'"
acceptance_commands:
  - "python3 {task_dir}/validate.py {workspace}"
issue_body: |
  Whole-variable assignment of extended derived types does not copy the
  parent type components correctly.  When a type extends another through
  multiple levels of inheritance, assigning one instance to another
  silently drops the inherited members.  The fix is in the LLVM codegen
  utilities for struct deep-copy.
acceptance_hint: |
  The validator compiles and runs integration_tests/derived_types_49.f90
  using the built lfortran binary. The test constructs a doubly-extended
  derived type, assigns it, and verifies all inherited members survive.
