id: lf-8150-optional-nested
title: "lfortran: fix present() for optional argument in nested subroutine"
repo_url: https://github.com/lfortran/lfortran.git
issue_url: https://github.com/lfortran/lfortran/pull/8150
base_commit: 21b1d383b0e932ba8f38e48841bc90ab21a64e84
fixed_commit: 34d5167369b7811497c3b0fafbc6c1324bdec29d
setup_commands:
  - "conda run -n lf-llvm11 bash -c 'cd {workspace} && bash build0.sh && cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DWITH_LLVM=yes -DCMAKE_BUILD_TYPE=Debug -DWITH_ZSTD=no -DWITH_ZLIB=no -DWITH_RUNTIME_STACKTRACE=yes && ninja -C build'"
acceptance_commands:
  - "python3 {task_dir}/validate.py {workspace}"
issue_body: |
  The present() intrinsic returns incorrect results when an optional
  argument is passed from a host subroutine to a nested (contained)
  subroutine. The optional attribute is lost during the nested call.
acceptance_hint: |
  The validator compiles and runs integration_tests/intrinsics_392.f90
  using the built lfortran binary. The test passes an optional argument
  through a nested subroutine and checks present() returns true.
