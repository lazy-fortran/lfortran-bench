id: lf-7399-move-alloc-dealloc
title: "lfortran: fix deallocate variable in move_alloc after assignment"
repo_url: https://github.com/lfortran/lfortran.git
issue_url: https://github.com/lfortran/lfortran/pull/7399
base_commit: a040b1b9000269915f99c0a0f87f8c7872349a1b
fixed_commit: 53aec6d39c7a839ab0b2a96dcd9130ad0242ccbc
setup_commands:
  - "conda run -n lf-llvm11 bash -c 'cd {workspace} && bash build0.sh && cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DWITH_LLVM=yes -DCMAKE_BUILD_TYPE=Debug -DWITH_ZSTD=no -DWITH_ZLIB=no -DWITH_RUNTIME_STACKTRACE=yes && ninja -C build'"
acceptance_commands:
  - "python3 {task_dir}/validate.py {workspace}"
issue_body: |
  After move_alloc transfers the allocation from source to destination,
  the source variable is not properly deallocated.  The source should be
  left in an unallocated state per the Fortran standard, but it remains
  allocated after the call.  The fix is in the AST body visitor for
  move_alloc semantics.
acceptance_hint: |
  The validator compiles and runs integration_tests/intrinsics_378.f90
  using the built lfortran binary. The test calls move_alloc and checks
  that the source array is no longer allocated afterward.
