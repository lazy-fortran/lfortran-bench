id: lf-8390-nested-struct-global
title: "lfortran: fix nested subroutine access to host-associated class argument"
repo_url: https://github.com/lfortran/lfortran.git
issue_url: https://github.com/lfortran/lfortran/pull/8390
base_commit: a5905c7e194f5ff30bd07a0547136076af84ad5a
fixed_commit: 06871e5264721dbd327448c21c0168d0412943ca
setup_commands:
  - "conda run -n lf-llvm11 bash -c 'cd {workspace} && bash build0.sh && cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DWITH_LLVM=yes -DCMAKE_BUILD_TYPE=Debug -DWITH_ZSTD=no -DWITH_ZLIB=no -DWITH_RUNTIME_STACKTRACE=yes && ninja -C build'"
acceptance_commands:
  - "python3 {task_dir}/validate.py {workspace}"
issue_body: |
  Nested (contained) subroutines cannot access the host subroutine's
  polymorphic class argument. Passing a host-associated class variable
  to another procedure from within a contained subroutine produces a
  compilation error or incorrect code generation.
acceptance_hint: |
  The validator compiles and runs integration_tests/nested_16.f90 using
  the built lfortran binary. The test modifies a class argument through
  a nested subroutine call chain and verifies the mutations.
