id: lf-8200-struct-implied-do
title: "lfortran: fix struct array initialization with implied do loop"
repo_url: https://github.com/lfortran/lfortran.git
issue_url: https://github.com/lfortran/lfortran/pull/8200
base_commit: 310037412bdde237cb850ac480bda0ed93453157
fixed_commit: 57b6c35e26cc2a0eba3cedf8f75dba6d72e41639
setup_commands:
  - "conda run -n lf-llvm11 bash -c 'cd {workspace} && bash build0.sh && cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DWITH_LLVM=yes -DCMAKE_BUILD_TYPE=Debug -DWITH_ZSTD=no -DWITH_ZLIB=no -DWITH_RUNTIME_STACKTRACE=yes && ninja -C build'"
acceptance_commands:
  - "python3 {task_dir}/validate.py {workspace}"
issue_body: |
  Derived type array initialization using implied do loops fails at
  compile time. Expressions like [(my_type(i), i=1,5)] are not handled
  correctly, producing errors during ASR construction.
acceptance_hint: |
  The validator compiles and runs integration_tests/derived_types_72.f90
  using the built lfortran binary. The test initializes a struct array
  with an implied do loop and verifies the values.
