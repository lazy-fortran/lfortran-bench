id: lf-8412-string-nullify
title: "lfortran: fix nullify on deferred-length character pointer"
repo_url: https://github.com/lfortran/lfortran.git
issue_url: https://github.com/lfortran/lfortran/pull/8412
base_commit: ec446e7b63eb3702f8c25271ec75b08113c6411a
fixed_commit: e9a03c04e222563671143ff9346dd081695690c9
setup_commands:
  - "conda run -n lf-llvm11 bash -c 'cd {workspace} && bash build0.sh && cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DWITH_LLVM=yes -DCMAKE_BUILD_TYPE=Debug -DWITH_ZSTD=no -DWITH_ZLIB=no -DWITH_RUNTIME_STACKTRACE=yes && ninja -C build'"
acceptance_commands:
  - "python3 {task_dir}/validate.py {workspace}"
issue_body: |
  Nullify on a deferred-length character pointer (character(len=:),
  pointer) causes a compilation error. The compiler does not handle
  the nullification of character pointers with deferred length.
acceptance_hint: |
  The validator compiles and runs integration_tests/nullify_07.f90
  using the built lfortran binary. The test nullifies a deferred-length
  character pointer and checks len returns 0.
