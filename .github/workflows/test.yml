name: test
on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Run behavioral tests
        run: python -m unittest discover -s tests -v
      - name: Validate task manifests
        run: |
          shopt -s nullglob
          for f in tasks/*/task.yaml tasks/*/*/task.yaml; do
            python -c "
          import yaml, sys
          t = yaml.safe_load(open('$f'))
          for key in ('id', 'title', 'repo_url', 'base_commit', 'fixed_commit'):
              assert key in t, f'missing {key} in $f'
          print(f'OK: $f')
          "
          done
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
