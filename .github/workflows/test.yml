name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Run behavioral tests
        run: python -m unittest discover -s tests -v
      - name: Validate task manifests
        run: |
          shopt -s nullglob
          for f in tasks/*/task.yaml tasks/*/*/task.yaml; do
            python -c "
          import yaml, sys
          t = yaml.safe_load(open('$f'))
          for key in ('id', 'title', 'repo_url', 'base_commit', 'fixed_commit'):
              assert key in t, f'missing {key} in $f'
          print(f'OK: $f')
          "
          done
